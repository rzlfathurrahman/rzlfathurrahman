name: contribution graph art

on:
  schedule:
    # weekly — the graph barely changes day to day, and this keeps runner time near zero
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # pinned to a commit SHA (v5.3.2) so the tag can't be moved under us
      - uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: opportunistic

      # the action only ships github/github-dark palettes, so repaint its dark
      # output to Catppuccin Frappe. Source hexes come from the action's
      # src/shared/constants.ts (GITHUB_DARK + the github-dark theme).
      - name: repaint to catppuccin frappe
        run: |
          sed -e 's/#0d1117/#303446/g' \
              -e 's/#161b22/#414559/g' \
              -e 's/#0e4429/#8caaee/g' \
              -e 's/#006d32/#babbf1/g' \
              -e 's/#26a641/#ca9ee6/g' \
              -e 's/#39d353/#f4b8e4/g' \
              -e 's/#8b949e/#a5adce/g' \
              -e 's/#ffffff/#c6d0f5/g' \
              -e 's/#808080/#737994/g' \
              -e 's/fill="yellow"/fill="#e5c890"/g' \
              dist/pacman-contribution-graph-dark.svg > dist/pacman-frappe.svg
          # fail loudly if the upstream palette changes and the repaint stops matching
          if grep -qE '#0d1117|#161b22|#0e4429|#006d32|#26a641|#39d353' dist/pacman-frappe.svg; then
            echo "upstream palette changed — update the sed map" >&2
            exit 1
          fi
          # publish the repainted file only
          find dist -name '*.svg' ! -name 'pacman-frappe.svg' -delete

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
